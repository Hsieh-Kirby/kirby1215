<footer class="site-footer"><p>© {{ now.Year }} 謝科比的大雜把園地</p></footer>
<button class="back-to-top" id="back-to-top" type="button" aria-label="回到頁面最上面" title="回到最上面">↑</button>
<script>
(function () {
    const button = document.getElementById("back-to-top");
    if (!button) return;

    function updateButton() {
        button.classList.toggle("is-visible", window.scrollY > 500);
    }

    button.addEventListener("click", function () {
        window.scrollTo({ top: 0, behavior: "smooth" });
    });
    window.addEventListener("scroll", updateButton, { passive: true });
    updateButton();
})();
</script>
{{ with .Site.Params.goatcounterCode }}
{{ if not hugo.IsServer }}
<script data-goatcounter="https://{{ . }}.goatcounter.com/count"
        data-goatcounter-settings='{"no_onload": true}'
        async src="https://gc.zgo.at/count.js"></script>
<script>
(function countVisitWhenReady() {
    if (!window.goatcounter || !window.goatcounter.count) {
        window.setTimeout(countVisitWhenReady, 150);
        return;
    }
    window.goatcounter.count();
    window.goatcounter.count({ path: "/site-visitor", title: "網站訪客" });
})();
</script>
{{ end }}
{{ end }}
